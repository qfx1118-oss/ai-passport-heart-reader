<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>昨日心力 · 连接 Wi-Fi</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#f5f7fa,#dce7f2);color:#20262d;font:16px/1.6 -apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh;display:grid;place-items:center;padding:28px}main{width:100%;max-width:430px;background:#fff;border-radius:24px;padding:32px;box-shadow:0 8px 30px #a8b9cc35}h1{font-size:28px;line-height:1.3;margin:0 0 16px}p{color:#5d6978;margin:0 0 24px}label{display:block;font-weight:600;margin:20px 0 8px}input{width:100%;padding:13px;border:1px solid #a9b6c5;border-radius:10px;font:inherit;color:#20262d;background:#fff;caret-color:#345f91}input:focus-visible,button:focus-visible{outline:3px solid #739bc9;outline-offset:3px}button{width:100%;margin-top:26px;padding:13px;background:#345f91;color:white;border:0;border-radius:12px;font:inherit;font-weight:600;cursor:pointer}button:hover{background:#264b77}button:disabled{background:#65798e;cursor:wait}#status{margin-top:18px;color:#345f91;overflow-wrap:anywhere}.hint{font-size:13px;margin:18px 0 0}::selection{background:#c4d3e4;color:#20262d}</style><main><h1>连接 Wi-Fi</h1><p>让「昨日心力」每天自动更新。请保持 AI Passport 通过 USB 连接这台 Mac。</p><form id="setup"><label for="ssid">Wi-Fi 名称</label><input id="ssid" name="ssid" required autocomplete="off" placeholder="输入 2.4 GHz Wi-Fi 的名称"><label for="password">Wi-Fi 密码</label><input id="password" name="password" type="password" autocomplete="off" placeholder="开放网络可留空"><button id="submit">保存到 AI Passport</button></form><div id="status" role="status" aria-live="polite"></div><p class="hint">密码仅在本机处理并写入你的设备，不发送到聊天或云端。完成后设备会重启；Mac 和设备需连接同一局域网。</p></main><script>
const form=document.getElementById('setup'),status=document.getElementById('status'),button=document.getElementById('submit');form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;status.textContent='正在保存，请稍候…';try{const r=await fetch('/setup',{method:'POST',headers:{'Content-Type':'application/json','X-Setup-Token':'__SETUP_TOKEN__'},body:JSON.stringify({ssid:form.ssid.value,password:form.password.value})});const data=await r.json();if(!r.ok)throw new Error(data.message||'配置失败，请检查 USB 连接');form.password.value='';status.textContent=data.message;}catch(e){status.textContent=e.message;}finally{button.disabled=false;}});
</script></html>
